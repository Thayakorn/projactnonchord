        .falling-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s ease;
            z-index: 50;
        }
        .falling-item:active { cursor: grabbing; }
        .falling-item.dragging {
            z-index: 999999 !important;
            transform: scale(1.1);
            position: fixed !important;
            pointer-events: auto !important;
        }

        .drop-zone.highlight {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }
        .correct-effect { animation: correctPulse 0.5s ease-out; }
        .wrong-effect { animation: wrongShake 0.5s ease-out; }
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); background: #22c55e; }
            100% { transform: scale(1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }
        .fade-out { animation: fadeOut 0.3s ease-out forwards; }
        @keyframes scorePopup {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }

            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .score-popup { animation: scorePopup 0.8s ease-out forwards; }
        body { overscroll-behavior: none; }

        let gameState = {
            score: 0,
            time: 30,
            maxTime: 30,
            combo: 0,
            isPlaying: false,
            fallingItems: [],
            spawnInterval: null,
            timerInterval: null,
            difficulty: 'hard',
            difficultyMultiplier: 2.2 // เพิ่มค่าเริ่มต้นเพื่อกันบั๊ก
        };

        let itemIdCounter = 0;
        let draggedItem = null;
        let currentSessionHighScore = 0; // ตัวแปรนี้จะถูกล้างค่าเป็น 0 เสมอเมื่อรีเฟรชหน้าเว็บ

        function loadHighScore() { 
            return currentSessionHighScore; 
        }
        
        function saveHighScore(score) { 
            currentSessionHighScore = score; 
        }
        
        function updateHighScoreDisplay() {
            document.getElementById('highScore').textContent = gameState.highScore;
        }

        const gameArea = document.getElementById('game-area');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const comboEl = document.getElementById('combo');
        const startScreen = document.getElementById('start-screen');
        const difficultyScreen = document.getElementById('difficulty-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const easyBtn = document.getElementById('easy-btn');
        const mediumBtn = document.getElementById('medium-btn');
        const hardBtn = document.getElementById('hard-btn');
        const backBtn = document.getElementById('back-btn');
        const restartBtn = document.getElementById('restart-btn');
        const changeDifficultyBtn = document.getElementById('change-difficulty-btn');
        const gameoverIcon = document.getElementById('gameover-icon');
        let dropZones = document.querySelectorAll('.drop-zone');

        function createFallingItem() {
            // 1. กำหนดหมวดหมู่คำตอบที่อนุญาตตามระดับความยาก
            let allowedTypes = [];
            if (gameState.difficulty === 'easy') {
                allowedTypes = ['PT', 'NT', 'SUS', 'APP']; // ง่าย 4 ตัวเลือก
            } else if (gameState.difficulty === 'medium') {
                allowedTypes = ['PT', 'NT', 'SUS', 'APP', 'ET', 'ANT']; // ปานกลาง 6 ตัวเลือก
            } else {
                allowedTypes = ['PT', 'NT', 'SUS', 'APP', 'ET', 'ANT', 'FN']; // ยาก 7 ตัวเลือก
            }

            // 2. ดึงโจทย์ทั้งหมดจาก nctTypes ที่มีหมวดหมู่ตรงกับที่อนุญาต (ตัดข้อที่ไม่มีกล่องคำตอบทิ้งไปเลย)
            const availableItems = nctTypes.filter(item => allowedTypes.includes(item.type));
            
            // 3. สุ่มโจทย์ขึ้นมา 1 ข้อ
            const nct = availableItems[Math.floor(Math.random() * availableItems.length)];
            const id = itemIdCounter++;
            
            const areaRect = gameArea.getBoundingClientRect();
            const isMobile = window.innerWidth < 768;
            const itemWidth = isMobile ? 100 : 140;
            const x = Math.random() * (areaRect.width - itemWidth - 20) + 10;
            
            const item = document.createElement('div');
            item.className = 'falling-item bg-white/95 rounded-xl p-2 md:p-3 shadow-xl border-2 border-purple-300/50';
            item.style.width = itemWidth + 'px';
            item.style.left = x + 'px';
            item.style.top = '-160px';
            item.dataset.id = id;
            item.dataset.type = nct.type;
            
            item.innerHTML = `<div class="h-14 md:h-20 flex items-center justify-center">${nct.svg}</div>`;
            gameArea.appendChild(item);
            
            const itemData = {
                id,
                element: item,
                type: nct.type,
                x,
                y: -160,
                speed: (0.3 + Math.random() * 0.2) * (isMobile ? 0.8 : 1) 
            };
            
            gameState.fallingItems.push(itemData);
            
            item.addEventListener('mousedown', startDrag);
            item.addEventListener('touchstart', startDrag, { passive: false });
        }

        function startDrag(e) {
            if (!gameState.isPlaying) return;
            
            e.preventDefault();
            const item = e.currentTarget;
            draggedItem = gameState.fallingItems.find(i => i.id === parseInt(item.dataset.id));
            
            if (!draggedItem) return;
            
            item.classList.add('dragging');
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const rect = item.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const offsetX = clientX - rect.left - centerX;
            const offsetY = clientY - rect.top - centerY;
            
            function onMove(moveEvent) {
                if (!draggedItem) return;
                
                const moveX = moveEvent.clientX || (moveEvent.touches && moveEvent.touches[0].clientX);
                const moveY = moveEvent.clientY || (moveEvent.touches && moveEvent.touches[0].clientY);
                
                const areaRect = gameArea.getBoundingClientRect();
                draggedItem.element.style.left = (moveX - areaRect.left - centerX) + 'px';
                draggedItem.element.style.top = (moveY - areaRect.top - centerY) + 'px';
                
                dropZones.forEach(zone => {
                    const zoneRect = zone.getBoundingClientRect();
                    if (moveX >= zoneRect.left && moveX <= zoneRect.right &&
                        moveY >= zoneRect.top && moveY <= zoneRect.bottom) {
                        zone.classList.add('highlight');
                    } else {
                        zone.classList.remove('highlight');
                    }
                });
            }
            
            function onEnd(endEvent) {
                if (!draggedItem) return;
                
                item.classList.remove('dragging');
                
                const endX = endEvent.clientX || (endEvent.changedTouches && endEvent.changedTouches[0].clientX);
                const endY = endEvent.clientY || (endEvent.changedTouches && endEvent.changedTouches[0].clientY);
                
                let droppedCorrectly = false;
                
                dropZones.forEach(zone => {
                    zone.classList.remove('highlight');
                    const zoneRect = zone.getBoundingClientRect();
                    
                    if (endX >= zoneRect.left && endX <= zoneRect.right &&
                        endY >= zoneRect.top && endY <= zoneRect.bottom) {
                        droppedCorrectly = true;
                        
                        if (zone.dataset.answer === draggedItem.type) {
                            handleCorrectAnswer(zone, item);
                        } else {
                            handleWrongAnswer(zone, item);
                        }
                    }
                });
                
                if (!droppedCorrectly) {
                    item.style.position = 'absolute';
                    item.style.left = draggedItem.x + 'px';
                    item.style.top = draggedItem.y + 'px';
                }
                
                draggedItem = null;
                
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }
            
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }
        function handleCorrectAnswer(zone, item) {
            gameState.score += 10 + gameState.combo * 2;
            gameState.combo++;
            gameState.time = Math.min(gameState.maxTime, gameState.time + 2);
            zone.classList.add('correct-effect');
            item.classList.add('fade-out');
            
            showScorePopup(item, '+' + (10 + (gameState.combo - 1) * 2), '#22c55e');
            showScorePopup(zone, '+2s', '#22d3ee');
            setTimeout(() => zone.classList.remove('correct-effect'), 500);
            
            const itemId = parseInt(item.dataset.id);
            setTimeout(() => {
                item.remove();
                gameState.fallingItems = gameState.fallingItems.filter(i => i.id !== itemId);
            }, 300);
            updateStats();
        }

        function handleWrongAnswer(zone, item) {
            gameState.combo = 0;
            gameState.maxTime = Math.max(5, gameState.maxTime - 2);
            gameState.time = Math.max(0, gameState.time - 2);
            zone.classList.add('wrong-effect');
            
            showScorePopup(zone, '-2s', '#ef4444');
            setTimeout(() => zone.classList.remove('wrong-effect'), 500);
            
            item.classList.add('fade-out');
            const itemId = parseInt(item.dataset.id);
            setTimeout(() => {
                item.remove();
                gameState.fallingItems = gameState.fallingItems.filter(i => i.id !== itemId);
            }, 300);
            updateStats();
        }

        function showScorePopup(element, text, color) {
            const popup = document.createElement('div');
            popup.className = 'score-popup absolute text-2xl font-bold pointer-events-none';
            popup.style.color = color;
            popup.style.left = '50%';
            popup.style.top = '50%';
            popup.style.transform = 'translate(-50%, -50%)';
            popup.style.zIndex = '1000';
            popup.textContent = text;
            element.style.position = 'relative';
            element.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function updateStats() {
            scoreEl.textContent = gameState.score;
            timerEl.textContent = Math.ceil(gameState.time);
            comboEl.textContent = gameState.combo;
            
            if (gameState.time <= 5) {
                timerEl.classList.remove('text-cyan-400');
                timerEl.classList.add('text-red-400');
            } else if (gameState.time <= 10) {
                timerEl.classList.remove('text-cyan-400', 'text-red-400');
                timerEl.classList.add('text-yellow-400');
            } else {
                timerEl.classList.remove('text-red-400', 'text-yellow-400');
                timerEl.classList.add('text-cyan-400');
            }
        }

        function gameLoop() {
            if (!gameState.isPlaying) return;
            const areaRect = gameArea.getBoundingClientRect();
            
            gameState.fallingItems.forEach(item => {
                if (draggedItem && draggedItem.id === item.id) return;
                
                item.y += item.speed;
                item.element.style.top = item.y + 'px';
                
                if (item.y > areaRect.height + 50) {
                    item.element.remove();
                    gameState.fallingItems = gameState.fallingItems.filter(i => i.id !== item.id);
                    gameState.combo = 0;
                    updateStats();
                }
            });
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState.score = 0;
            gameState.time = 30;
            gameState.maxTime = 30;
            gameState.combo = 0;
            gameState.isPlaying = true;
            gameState.fallingItems = [];
            gameState.highScore = loadHighScore();

            // จัดแถว (ปานกลางแถวละ 3 / อื่นๆแถวละ 4)
            const dropZoneContainer = document.getElementById('drop-zone-container');
            if (gameState.difficulty === 'medium') {
                dropZoneContainer.className = "grid grid-cols-3 gap-3";
            } else {
                dropZoneContainer.className = "grid grid-cols-4 gap-2";
            }

            // ซ่อนปุ่มตามระดับความยาก
            const allDropZones = document.querySelectorAll('.drop-zone');
            allDropZones.forEach((zone, index) => {
                if (gameState.difficulty === 'easy' && index >= 4) {
                    zone.style.display = 'none';
                } else if (gameState.difficulty === 'medium' && index >= 6) {
                    zone.style.display = 'none';
                } else {
                    zone.style.display = 'flex';
                }
            });
            
            dropZones = document.querySelectorAll('.drop-zone:not([style*="display: none"])');  
            gameArea.querySelectorAll('.falling-item').forEach(el => el.remove());
            gameArea.querySelectorAll('.falling-item').forEach(el => el.remove());
            
            startScreen.classList.add('hidden');
            difficultyScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            
            updateStats();
            updateHighScoreDisplay();
            
            createFallingItem();
            gameState.spawnInterval = setInterval(() => {
                if (gameState.isPlaying && gameState.fallingItems.length < 3) {
                    createFallingItem();
                }
            }, 2000);
            
            gameLoop();
            
            gameState.timerInterval = setInterval(() => {
                if (!gameState.isPlaying) return;
                gameState.time -= 0.1;
                updateStats();
                if (gameState.time <= 0) endGame();
            }, 100);
        }

        function showDifficultyScreen() {
            startScreen.classList.add('hidden');
            difficultyScreen.classList.remove('hidden');
        }

        function hideDifficultyScreen() {
            difficultyScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        function showDifficultyScreenFromGameOver() {
            gameoverScreen.classList.add('hidden');
            difficultyScreen.classList.remove('hidden');
        }

        function selectDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            if (difficulty === 'easy') gameState.difficultyMultiplier = 0.6;
            else if (difficulty === 'medium') gameState.difficultyMultiplier = 1.2;
            else gameState.difficultyMultiplier = 2.2;
            startGame();
        }

        function endGame() {
            gameState.isPlaying = false;
            clearInterval(gameState.spawnInterval);
            clearInterval(gameState.timerInterval);
            
            // เช็คว่าคะแนนรอบนี้ มากกว่า High Score ของเซสชันนี้หรือไม่
            if (gameState.score > currentSessionHighScore) {
                saveHighScore(gameState.score); // อัปเดตค่าสถิติใหม่
                gameState.highScore = currentSessionHighScore;
                updateHighScoreDisplay(); // อัปเดตตัวเลขหน้าจอ
            }

            finalScoreEl.textContent = gameState.score;
            gameoverScreen.classList.remove('hidden');
        }
        
        startBtn.addEventListener('click', showDifficultyScreen);
        restartBtn.addEventListener('click', startGame);
        easyBtn.addEventListener('click', () => selectDifficulty('easy'));
        mediumBtn.addEventListener('click', () => selectDifficulty('medium'));
        hardBtn.addEventListener('click', () => selectDifficulty('hard'));
        backBtn.addEventListener('click', hideDifficultyScreen);
        if (changeDifficultyBtn) changeDifficultyBtn.addEventListener('click', showDifficultyScreenFromGameOver);

    </script>
